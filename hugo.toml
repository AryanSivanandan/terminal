baseURL = "/"
languageCode = "en-us"
title = "Aryan Sivanandan"


[pagination]
  pageSize = 5

[module]
[[module.imports]]
  path = "github.com/panr/hugo-theme-terminal/v4"

[params]
  contentTypeName = "posts"
  themeColor = "yellow"
  showMenuItems = 5
  showLanguageSelector = false
  fullWidthTheme = false
  centerTheme = true

  author = "Aryan"
  description = "Computer Engineering student • AI/ML • Backend • Curious builder"
  avatarURL = "/img/pfp.jpg"
  showFooter = false

[markup.goldmark.renderer]
  unsafe = true

[languages]
  [languages.en]
    languageName = "English"
    title = "Aryan Terminal"

    [languages.en.params]
      subtitle = "Welcome to my terminal."
      owner = "Aryan"
      keywords = "Aryan, AI, Backend, Hugo, Portfolio"
      copyright = "© 2026 Aryan"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about"
    weight = 1

  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects"
    weight = 2

  [[menu.main]]
    identifier = "experience"
    name = "Work"
    url = "/experience"
    weight = 3

  [[menu.main]]
    identifier = "skills"
    name = "Skills"
    url = "/skills"
    weight = 4

  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact"
    weight = 5
